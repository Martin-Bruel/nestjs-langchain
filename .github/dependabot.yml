version: 2

updates:
  # ---------------------------------------------------------------- npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [technical]

    # Widens a range only when the new version falls outside it: a raised peer
    # floor reaches every consumer. See #40.
    versioning-strategy: increase-if-necessary

    # Conventional prefixes, which commitlint requires and the changelog of #24
    # reads.
    commit-message:
      prefix: chore
      prefix-development: chore

    # Minor and patch updates grouped; majors come one by one, to be read.
    groups:
      # The samples' ESLint toolchain, updated from the root since they are its
      # workspaces (#140), and `eslint-plugin-jsdoc`, which oxlint loads. They
      # peer-depend on each other, so they move together, majors included. See
      # #48.
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-*
          - typescript-eslint
          - '@typescript-eslint/*'

      # @nestjs/* pin each other's major, so they move together, majors
      # included. Before the two below, as a dependency joins the first group
      # that matches it. See #121.
      nestjs:
        patterns:
          - '@nestjs/*'

      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  # ------------------------------------------------------ github actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [CI/CD]
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
