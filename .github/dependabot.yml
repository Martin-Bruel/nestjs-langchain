version: 2

updates:
  # ---------------------------------------------------------------- npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [technical]

    # Only widen a declared range when the new version does not satisfy it.
    # For a library this matters: needlessly bumping the floor in
    # peerDependencies forces churn on every consumer.
    versioning-strategy: increase-if-necessary

    # commitlint enforces Conventional Commits, and the changelog in #24 is
    # generated from them. Dependabot's default "Bump x from a to b" would be
    # dropped or miscategorised there.
    commit-message:
      prefix: chore
      prefix-development: chore

    # Routine updates arrive as two PRs a week instead of twenty. Majors are
    # deliberately left out of the groups: they deserve to be read one by one.
    groups:
      # eslint, its config packages and typescript-eslint declare peer
      # dependencies on each other, so a major that moves one alone cannot
      # install: PRs #46 and #47 both died on ERESOLVE. They have to travel
      # together, majors included — hence no update-types filter here.
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-*
          - typescript-eslint
          - '@typescript-eslint/*'

      # @nestjs/* packages pin each other: @nestjs/core@11 requires
      # @nestjs/common@^11, so a major moving one alone cannot install. PRs #45,
      # #71, #94, #95, #116 and #118 all died on ERESOLVE. No update-types
      # filter, so majors travel together.
      #
      # Above the two below, which a dependency reaches only when no earlier
      # group matches it, so a NestJS minor stays in one pull request too.
      nestjs:
        patterns:
          - '@nestjs/*'

      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  # ------------------------------------------------------ github actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [CI/CD]
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
