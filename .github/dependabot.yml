version: 2

updates:
  # ---------------------------------------------------------------- npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [technical]

    # Widens a range only when the new version falls outside it: a raised peer
    # floor reaches every consumer. See #40.
    versioning-strategy: increase-if-necessary

    # Conventional prefixes, which commitlint requires and the changelog of #24
    # reads.
    commit-message:
      prefix: chore
      prefix-development: chore

    # Minor and patch updates grouped; majors come one by one, to be read.
    # A dependency joins the first group that matches it: the groups that carry
    # majors come first.
    groups:
      # @nestjs/* pin each other's major, so they move together, majors
      # included. See #121.
      nestjs:
        patterns:
          - '@nestjs/*'

      # @vitest/* pin vitest's exact version, so they move together, majors
      # included. See #286.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'

      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  # ------------------------------------------------------ github actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [CI/CD]
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
