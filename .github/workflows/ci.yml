name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# npm 10 (Node 22) and npm 11 (Node 24) write lockfiles the other rejects: 11
# reads it everywhere, and is the one to use locally. See #111.
env:
  NPM_VERSION: 11

# Cancels an obsolete pull request run, never a run on main. The guard is the
# group key: `cancel-in-progress` is read as a string, so even "false" cancels.
# The PR number groups a pull request's pushes; on main, the sha is unique. The
# workflow name keeps the release workflow out of the group. See #48.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Actions are pinned by commit, their version in a comment: Dependabot updates
# both. See #200.
jobs:
  verify:
    name: Node ${{ matrix.node }} / NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Report every version that fails, not just the first one.
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        # Both majors the peers accept: 12 is pure ESM, 11 CommonJS. See #80.
        nest: [11, 12]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci` fails on a lockfile out of sync. Scoped to the root, so the samples'
      # toolchains stay out (#85). Through npx, so the global npm stays this
      # Node's, the one `verify:package` installs with, as a consumer would.
      - name: Install
        run: npx -y npm@${{ env.NPM_VERSION }} ci --workspaces=false --include-workspace-root

      # For both majors, so nothing depends on the one the lockfile carries. No
      # --force: an ERESOLVE means the peer range rejects this major.
      - name: Pin NestJS ${{ matrix.nest }}
        run: npm i --no-save --workspaces=false --include-workspace-root @nestjs/common@^${{ matrix.nest }} @nestjs/core@^${{ matrix.nest }} @nestjs/testing@^${{ matrix.nest }}

      # `lint:check`: `lint` fixes and exits 0, a fix the runner discards.
      - name: Lint
        run: npm run lint:check

      # Prettier, which oxlint does not run.
      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # publint checks the manifest, attw the types under node10, node16 (CJS
      # and ESM) and bundler. Its one ignored rule is ESM-only publishing: a
      # `require` of ESM, which the `engines` floor, Node 22.12, handles.
      - name: Verify the exports map and types
        run: npm run verify:exports

      # Resolves the peer range without --force and runs the packed build, which
      # the suite, importing the sources, never does.
      - name: Verify the packed package
        run: npm run verify:package -- ${{ matrix.nest }}

  # The one job building the samples, whose toolchains `verify` leaves out. See
  # #105.
  samples:
    name: Samples
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The `engines` floor.
          node-version: 22
          cache: npm

      # Unscoped, unlike `verify`: the workspaces are the point of this job.
      - name: Install
        run: npx -y npm@${{ env.NPM_VERSION }} ci

      # The samples resolve `nestjs-langchain` through the workspace link, to
      # `dist`.
      - name: Build the library
        run: npm run build

      - name: Build the samples
        run: npm run build --workspace samples/agent --workspace samples/chat

  # pnpm gives a package only what its manifest declares, so an undeclared
  # import fails here, not on a user's machine. One NestJS major: `verify`
  # covers the range. See #123.
  strict:
    name: Strict install
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12

      - name: Install
        run: npx -y npm@${{ env.NPM_VERSION }} ci --workspaces=false --include-workspace-root

      # Builds, packs, then installs the tarball into throwaway consumers, one
      # CommonJS and one ESM, and boots each.
      - name: Verify the packed package under pnpm
        run: npm run verify:package -- 12 pnpm

  # Every peer at the lowest version its range accepts, on the `engines` floor:
  # the oldest setup a consumer is allowed to run. The versions come from the
  # manifest, through `scripts/peer-floors.mjs`.
  floors:
    name: Floors / NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        nest: [11, 12]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install
        run: npx -y npm@${{ env.NPM_VERSION }} ci --workspaces=false --include-workspace-root

      - name: Pin every peer at its floor
        run: npm i --no-save --workspaces=false --include-workspace-root $(node scripts/peer-floors.mjs ${{ matrix.nest }})

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the packed package at the floors
        run: npm run verify:package -- ${{ matrix.nest }} npm floors

  # The one stable check name a ruleset requires, since it takes no pattern.
  # Every job added later joins `needs`. See #107.
  ci:
    name: CI
    # Without this the job is skipped as soon as a dependency fails, and a
    # skipped check is neither a pass nor a failure.
    if: always()
    needs: [verify, samples, strict, floors]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # For a matrix job the result is the aggregate: `success` only when every
      # combination succeeded. Anything else, cancelled and skipped included,
      # fails here.
      - name: Fail unless every job succeeded
        run: |
          echo "verify:  ${{ needs.verify.result }}"
          echo "samples: ${{ needs.samples.result }}"
          echo "strict:  ${{ needs.strict.result }}"
          echo "floors:  ${{ needs.floors.result }}"
          [ "${{ needs.verify.result }}" = "success" ] || exit 1
          [ "${{ needs.samples.result }}" = "success" ] || exit 1
          [ "${{ needs.strict.result }}" = "success" ] || exit 1
          [ "${{ needs.floors.result }}" = "success" ] || exit 1
