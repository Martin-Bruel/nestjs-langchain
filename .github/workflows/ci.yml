name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same pull request makes the previous run obsolete, so cancel it.
# A push to main must never be cancelled: every commit there has to be verified.
#
# The distinction lives in the group key, not in cancel-in-progress. An expression
# in cancel-in-progress is evaluated as a string, and every non-empty string is
# truthy — including "false" — so a guard written there silently does nothing.
# (Observed: commit 920b568 on main was cancelled by the next merge.)
#
# On pull_request the key is the PR number, shared across pushes to that PR, so a
# new push cancels the previous run and concurrent PRs never affect each other.
# On push the fallback is the commit sha, unique per commit, so nothing on main
# ever has a run to cancel.
#
# Groups are repository-wide, hence the workflow name in the key: without it, the
# release workflow would fight with this one over the same key.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest

    strategy:
      # Report every version that fails, not just the first one.
      fail-fast: false
      matrix:
        node: [22, 24]
        # peerDependencies accept both majors, so both have to be exercised.
        # NestJS 12 is pure ESM while 11 is CommonJS, which is the whole reason
        # this axis exists rather than trusting the lockfile.
        nest: [11, 12]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci, not install: fails on a lockfile out of sync with package.json
      # rather than silently resolving something else.
      - name: Install
        run: npm ci

      # The lockfile pins one major. Overriding it here, for both values rather
      # than only for 12, keeps the job honest: nothing silently depends on
      # whichever version the lockfile happens to carry.
      #
      # No --force and no --legacy-peer-deps: an ERESOLVE means the declared
      # peer range does not really accept this major.
      - name: Pin NestJS ${{ matrix.nest }}
        run: npm i --no-save @nestjs/common@^${{ matrix.nest }} @nestjs/core@^${{ matrix.nest }} @nestjs/testing@^${{ matrix.nest }}

      # lint:check, not lint: the `lint` script carries --fix, which repairs
      # violations and exits 0. On a runner that fix is discarded, so the
      # problem would stay in the repository with a green check.
      - name: Lint
        run: npm run lint:check

      # Its own step since the move to oxlint: Prettier used to run as an
      # ESLint rule, so formatting was covered by Lint. It no longer is.
      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # publint checks the manifest, attw resolves the types through node10,
      # node16 from CJS, node16 from ESM and bundler. The one ignored rule is
      # the deliberate consequence of publishing ESM only: a `require` lands on
      # an ESM file, which Node handles from 22.12 and the `engines` floor
      # guarantees. Ignoring the rule rather than the whole CJS profile keeps
      # that resolution checked for everything else.
      - name: Verify the exports map and types
        run: npm run verify:exports

      # What publint and attw cannot do: prove the peer range resolves without
      # --force, and run the published build. The suite imports the sources, so
      # nothing else ever executes what npm ships.
      - name: Verify the packed package
        run: npm run verify:package -- ${{ matrix.nest }}
